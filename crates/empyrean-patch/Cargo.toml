[package]
name = "empyrean-patch"
version = "0.14.0"
description = "The Empyrean Gate's node-graph patterns: document model, validation, WGSL codegen and control-rate evaluator"
license = "MIT"
edition = "2024"
publish = false

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
# The codegen tests parse and validate every generated shader, as wgpu would.
naga = { version = "29", features = ["wgsl-in"] }
