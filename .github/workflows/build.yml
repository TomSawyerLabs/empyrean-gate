name: Build (manual)

# The three-platform Tauri matrix is intentionally manual: it is slow and expensive.
# Release tags still run the equivalent checked build through release.yml.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same runner choice as release.yml — see the note there.
          - os: blacksmith-16vcpu-windows-2025
            artifact: empyrean-gate-windows
            binary: src-tauri/target/release/empyrean-gate.exe
          - os: blacksmith-16vcpu-ubuntu-2404
            artifact: empyrean-gate-linux
            binary: src-tauri/target/release/empyrean-gate
          - os: macos-latest
            artifact: empyrean-gate-macos
            binary: src-tauri/target/release/empyrean-gate
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system deps (webkit for the Tauri shell, ALSA for audio)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      # Restore the release-profile cache warm-cache.yml maintains on master,
      # instead of the default per-job key — which, on a fresh branch, has never
      # been written and made every first manual build start cold (~26 min on
      # Windows vs ~15 warm). `save-if: false` for the same reason as
      # release.yml: a cache saved from a feature branch is readable only by
      # that branch and would just eat quota.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-build
          save-if: false

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck frontend
        run: bun run typecheck

      # Builds the frontend (beforeBuildCommand), then the release binary with
      # embedded UI assets. --no-bundle: standalone binary only, no installer.
      - name: Build standalone binary
        run: bun tauri build --no-bundle

      # Linux only, and additional to the bare binary rather than replacing it.
      #
      # The bare Linux binary needs libwebkit2gtk present on the machine, which
      # is the one thing an installer would genuinely have fixed for us (Windows
      # and macOS both ship their webview with the OS). An AppImage carries those
      # libraries with it and is still a single executable file — so it keeps the
      # property the self-updater depends on, that "the app" is one path that can
      # be copied over itself. A .deb would not.
      #
      # `|| true`: proving the AppImage bundler works on the runner image is the
      # entire point of building it here first, and a failure should report
      # itself in the next step rather than take the whole matrix down.
      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        run: bun tauri build --bundles appimage || true

      - name: AppImage result
        if: runner.os == 'Linux'
        shell: bash
        run: |
          found=$(find src-tauri/target/release/bundle -name '*.AppImage' 2>/dev/null | head -1)
          if [ -n "$found" ]; then
            echo "AppImage built: $found ($(du -h "$found" | cut -f1))"
          else
            echo "::warning::no AppImage produced — the bundler did not run or failed"
            find src-tauri/target/release/bundle -type f 2>/dev/null | head -20 || echo "(no bundle dir at all)"
          fi

      - name: Build headless smoke-test binary
        working-directory: src-tauri
        run: cargo build --release --bin engine-smoke

      # sACN wire-format tests (packet layout, stream termination, discovery
      # paging) plus the benchmark harness. No GPU needed. --release reuses the
      # dependency artifacts the builds above already produced, instead of
      # compiling the tree again in the debug profile. One invocation for both
      # targets: two separate `cargo test` runs each pay their own
      # resolve/compile round-trip.
      - name: Rust unit + benchmark harness tests
        working-directory: src-tauri
        run: cargo test --release --lib --bin engine-smoke

      # CI runners have no GPU; just confirm the error path is the designed one
      # (clear "no Vulkan adapter" message, nonzero exit) rather than a crash.
      - name: Engine smoke test (expected to fail cleanly without a GPU)
        shell: bash
        run: |
          set +e
          out=$(./src-tauri/target/release/engine-smoke 2>&1)
          code=$?
          echo "$out"
          if [ $code -eq 0 ]; then
            echo "GPU available on runner; smoke test passed for real."
          elif echo "$out" | grep -q "No Vulkan adapter"; then
            echo "No GPU on runner; clean error path confirmed."
          else
            echo "engine-smoke crashed instead of erroring cleanly"
            exit 1
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
