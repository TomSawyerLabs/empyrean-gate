name: Release

# Push a version tag to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
# The full check suite runs first; the GitHub Release is created by CI only,
# with standalone binaries for every target attached.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Decides whether this run may spend Blacksmith minutes. Inert until the
  # BLACKSMITH_ORG_TOKEN secret exists; see cost-gate.yml.
  gate:
    uses: ./.github/workflows/cost-gate.yml
    secrets: inherit

  build:
    needs: gate
    # Scoped per-job rather than inheriting the top-level `contents: write` the
    # release job needs: this job only reads the repo. `id-token` mints the OIDC
    # token the attestation is signed against, and `attestations` writes the
    # resulting provenance record. See the attest step below.
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 16-vCPU Blacksmith runners for the two compile-bound long poles,
          # unless the gate says the month's free tier is spent, in which case
          # these are GitHub's free windows-latest / ubuntu-latest and the build
          # runs cold (~20 min). macOS stays on GitHub's free runners either
          # way: it was never the slowest job, and Blacksmith bills macOS at
          # 10-20x its Linux rate. Keep the warm cache on the same provider as
          # these jobs (see warm-cache.yml) — a cache written on one provider's
          # backend may not be readable from the other's runners.
          - os: ${{ needs.gate.outputs.windows }}
            artifact: empyrean-gate-windows-x64
            binary: src-tauri/target/release/empyrean-gate.exe
            asset: empyrean-gate-windows-x64.exe
          - os: ${{ needs.gate.outputs.linux }}
            artifact: empyrean-gate-linux-x64
            binary: src-tauri/target/release/empyrean-gate
            asset: empyrean-gate-linux-x64
          - os: macos-latest
            artifact: empyrean-gate-macos-arm64
            binary: src-tauri/target/release/empyrean-gate
            asset: empyrean-gate-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system deps (webkit for the Tauri shell, ALSA for audio)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      # Restores the release-profile cache warm-cache.yml saves on master. That
      # workflow is manual-only now (Blacksmith minutes cost money past the free
      # tier), so the entry may predate several dependency bumps; the restore-key
      # prefix still hits it and only the changed crates recompile. Restoring
      # also resets the entry's 7-day expiry, so regular releases keep it alive.
      # `shared-key` because rust-cache otherwise bakes the job id into the key,
      # and this job is `build` while the warm job is `warm` — different keys,
      # permanent miss. `save-if: false` because a cache written here would be
      # scoped to this tag's ref and readable by nothing afterwards: that is the
      # ~2.8 GB per release this repo was manufacturing and never reading, on a
      # 10 GB quota. See the header of warm-cache.yml.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-build
          save-if: false

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck frontend
        run: bun run typecheck

      # Browser binaries keyed by lockfile; `playwright install` below skips
      # the download for anything already present. The apt-installed system
      # deps (--with-deps) still run — they are not under this path.
      - uses: actions/cache@v4
        if: runner.os == 'Linux'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          # A stale hit is safe: install verifies versions and fetches only
          # what is missing, which is still most of the download saved.
          restore-keys: playwright-${{ runner.os }}-

      # One platform is enough: the layout gate checks CSS box geometry, which
      # does not vary by runner OS. Releases are what reach the show machine, so
      # it runs here as well as in checks.yml.
      - name: Layout gate
        if: runner.os == 'Linux'
        run: |
          bunx playwright install --with-deps chromium webkit
          bun run test:layout

      # Same reasoning, same bundle: whatever checks.yml gates a push on, a
      # release has to clear too.
      - name: UI behaviour tests
        if: runner.os == 'Linux'
        run: bun run test:behavior

      - name: Build standalone binary
        run: bun tauri build --no-bundle

      # One invocation for both targets — two separate `cargo test` runs each
      # pay their own resolve/compile round-trip.
      - name: Rust unit + benchmark harness tests
        working-directory: src-tauri
        run: cargo test --release --lib --bin engine-smoke

      # Linux only, and IN ADDITION to the bare binary. The bare one needs
      # libwebkit2gtk already installed; the AppImage carries it. Both are still
      # a single executable file, which is what the updater's promotion step
      # depends on — see `asset_name` for how a running copy picks its own shape.
      # No `|| true` here: the manual build workflow is where this gets proven,
      # and a release that silently drops an asset is worse than a failed one.
      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        run: bun tauri build --bundles appimage

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p release-assets
          cp "${{ matrix.binary }}" "release-assets/${{ matrix.asset }}"

      - name: Stage the AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Tauri names it "Empyrean Gate_<version>_amd64.AppImage" — spaces and
          # a version that would break the updater's exact-name asset lookup.
          src=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' | head -1)
          if [ -z "$src" ]; then
            echo "::error::AppImage build produced nothing"
            exit 1
          fi
          cp "$src" "release-assets/${{ matrix.asset }}.AppImage"
          ls -lh release-assets/

      # Signs a provenance statement binding each asset's SHA-256 to THIS
      # workflow, commit and tag, via Sigstore and GitHub's OIDC token. No key
      # material to hold or rotate — the signing identity is the workflow run
      # itself, and the record is public and auditable after the fact:
      #
      #   gh attestation verify empyrean-gate-windows-x64.exe \
      #     --repo TomSawyerLabs/empyrean-gate
      #
      # That command is the supported way to check a downloaded binary really
      # came from this pipeline. Note it is NOT what the in-app updater enforces
      # at install time: verifying a Sigstore bundle offline needs the Sigstore
      # trust root and a Rekor inclusion proof, which is not something to
      # reimplement inside updater.rs. The updater's own gate is the release
      # author check (`RELEASE_AUTHOR`); this attestation is the audit trail.
      # See plans/ci-security-review.md for where the gap stands.
      #
      # Attesting here rather than in the release job is deliberate: this is
      # where the bytes are produced, and the release job only re-uploads them,
      # so the digests are the same either way.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-assets/*

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          # The directory, not one named file: Linux stages two assets.
          path: release-assets/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    # The signing key lives in this environment, not in plain repo secrets, so
    # that a deployment TAG RULE of `v*` can decide which refs may reach it. A
    # workflow run from a branch — including one added by a push to master —
    # cannot read it. Combined with the ruleset that restricts who may create a
    # `v*` tag, the only way to produce a release signature is a tag the repo
    # owner pushed. That is the whole security argument for a long-lived key
    # being acceptable here; see plans/ci-security-review.md.
    environment: release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: assets
          merge-multiple: true

      # What the in-app updater actually enforces before it will run a
      # downloaded binary. The attestation added in the build job is an audit
      # trail; this is the gate, because it is verifiable offline on the rig
      # with nothing but the public key compiled into the binary.
      #
      # The message signed is, with no trailing newline:
      #
      #   empyrean-gate-release-v1\n<version>\n<asset name>\n<sha256 hex>
      #
      # Version and asset name are in there so a signature cannot be lifted onto
      # another platform's asset or replayed under a different version.
      # `updater::signing_message` builds the identical string and
      # `updater::tests::signature_vector_from_openssl` pins the format against a
      # signature made by this exact openssl invocation.
      - name: Sign release assets
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SIGNING_KEY:-}" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not available. Releases must be" \
                 "signed — the updater refuses unsigned releases, so publishing one" \
                 "would strand every fielded copy. Check the secret exists in the" \
                 "'release' environment and that this ref matches its tag rule."
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"

          key=$(mktemp)
          printf '%s\n' "$SIGNING_KEY" > "$key"

          # Rebuild a public-key PEM from the raw 32 bytes committed at
          # src-tauri/release-signing.pub — the same file the binary embeds via
          # include_str!. Signing and then verifying against THAT, rather than
          # against the private key's own public half, is the point: it proves the
          # key in CI and the key in the shipped binary are a pair. Get this wrong
          # and the failure would otherwise surface as a fleet that rejects every
          # update, discoverable only after the release is out.
          #
          # Assembled as PEM armor directly rather than via `openssl pkey -pubin
          # -inform DER`: that route silently declines to honor -pubin and reports
          # "Could not find private key of Public Key", which cost a debugging
          # round the first time. 302a300506032b6570032100 is the fixed Ed25519
          # SubjectPublicKeyInfo prefix; the remaining 32 bytes are the key.
          pub=$(mktemp)
          {
            echo "-----BEGIN PUBLIC KEY-----"
            printf '302a300506032b6570032100%s' \
              "$(tr -d '[:space:]' < src-tauri/release-signing.pub)" | xxd -r -p | base64
            echo "-----END PUBLIC KEY-----"
          } > "$pub"

          shopt -s nullglob
          signed=0
          for f in assets/*; do
            case "$f" in *.sig) continue ;; esac
            name=$(basename "$f")
            digest=$(sha256sum "$f" | cut -d' ' -f1)

            msg=$(mktemp)
            printf 'empyrean-gate-release-v1\n%s\n%s\n%s' "$version" "$name" "$digest" > "$msg"

            if ! openssl pkeyutl -sign -rawin -inkey "$key" -in "$msg" -out "$f.sigbin"; then
              echo "::error::could not sign $name — is RELEASE_SIGNING_KEY a valid ed25519 PEM?"
              exit 1
            fi

            # Checked explicitly rather than leaning on `set -e`: this is the step
            # whose whole purpose is to fail the release, so it does not get to
            # depend on shell error handling being configured right.
            if ! openssl pkeyutl -verify -rawin -pubin -inkey "$pub" \
                 -in "$msg" -sigfile "$f.sigbin"; then
              echo "::error::signature for $name does not verify against" \
                   "src-tauri/release-signing.pub. The CI signing key and the key" \
                   "compiled into the binary are not a pair — publishing this would" \
                   "strand every fielded copy. Refusing to release."
              exit 1
            fi

            xxd -p -c 256 "$f.sigbin" | tr -d '\n' > "$f.sig"
            printf '\n' >> "$f.sig"
            rm -f "$f.sigbin" "$msg"

            echo "signed $name ($digest)"
            signed=$((signed + 1))
          done

          rm -f "$key" "$pub"

          if [ "$signed" -eq 0 ]; then
            echo "::error::no assets were signed — nothing to release"
            exit 1
          fi
          echo "signed $signed asset(s)"

      # Created as a DRAFT, filled, checked, and only then published.
      #
      # Two problems with the obvious `gh release create <tag> assets/*`, both hit
      # for real on v0.12.0:
      #
      # 1. It uploads assets in parallel, and GitHub's upload endpoint returns
      #    sporadic 500s ("Error saving asset", "Error creating asset temp dir") on
      #    concurrent multi-hundred-MB uploads. Three consecutive attempts failed
      #    on a different large asset each time. Serial uploads with retries are
      #    slower and actually finish.
      # 2. It publishes the release BEFORE the assets are attached. The updater
      #    polls releases/latest every 6 h, so a partially uploaded release is a
      #    release the fleet can see and try to install. A draft is invisible to
      #    that endpoint, so the window does not exist.
      #
      # `gh` does delete the release when its own upload fails, which is why the
      # three failures left nothing behind — but that is cleanup after the fact,
      # not the same as never being visible.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l assets

          gh release create "$GITHUB_REF_NAME" \
            --title "Empyrean Gate $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            --draft

          for f in assets/*; do
            name=$(basename "$f")
            uploaded=false
            for attempt in 1 2 3 4 5; do
              if gh release upload "$GITHUB_REF_NAME" "$f" --clobber; then
                echo "uploaded $name"
                uploaded=true
                break
              fi
              delay=$((attempt * 10))
              echo "::warning::upload of $name failed (attempt $attempt/5); retrying in ${delay}s"
              sleep "$delay"
            done
            if [ "$uploaded" != true ]; then
              echo "::error::gave up uploading $name after 5 attempts. The release is" \
                   "left as a DRAFT with whatever uploaded, so nothing is served to the" \
                   "fleet; finish or delete it by hand."
              exit 1
            fi
          done

          # Every binary must have landed with its signature beside it. Publishing a
          # release whose .sig is missing would be refused by every fielded copy,
          # which looks like "updates are broken" rather than "one upload failed".
          present=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          missing=0
          while read -r name; do
            [ -n "$name" ] || continue
            case "$name" in *.sig) continue ;; esac
            if ! printf '%s\n' "$present" | grep -qx -- "$name.sig"; then
              echo "::error::$name has no $name.sig in the release"
              missing=1
            fi
          done <<< "$present"
          if [ "$missing" -ne 0 ]; then
            echo "::error::refusing to publish an incompletely signed release (left as draft)"
            exit 1
          fi

          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          echo "published $GITHUB_REF_NAME with:"
          printf '%s\n' "$present" | sed 's/^/  /'
