[package]
name = "empyrean-gate"
version = "0.10.12"
description = "GPU pattern generator and sACN output for the Empyrean Gate"
license = "MIT"
edition = "2024"
# Two binaries exist (app + engine-smoke); `tauri dev`'s bare `cargo run` needs this.
default-run = "empyrean-gate"

[lib]
name = "empyrean_gate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "empyrean-gate"
path = "src/main.rs"

[[bin]]
name = "engine-smoke"
path = "src/bin/engine_smoke.rs"

[[bin]]
name = "sacn-listen"
path = "src/bin/sacn_listen.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
# Local wall-clock time for the daily phase reset (`RenderConfig::phase_reset_at`).
# Everything else in here is UTC and hand-rolled (see `report.rs`), but "noon where
# the Gate stands" needs the platform's timezone database, DST rules and all.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
cpal = "0.18.2"
crossbeam-channel = "0.5.16"
dirs = "6.0.0"
env_logger = "0.11.11"
futures-util = { version = "0.3.34", features = ["sink"] }
fs2 = "0.4.3"
local-ip-address = "0.6.13"
network-interface = "2.0"
log = "0.4.33"
midir = "0.11.0"
notify = { version = "8.2.0", optional = true }
parking_lot = "0.12.5"
# Contact sheets in feedback report bundles — an agent investigating "I didn't
# like that pattern" needs to be able to *see* the frames, not just read numbers.
png = "0.18.1"
pollster = "1.0.1"
prodjlink-rs = { git = "https://github.com/anweiss/prodjlink-rs.git", rev = "4fc2bb302b0c3f8a07bb27598f64bd38aa1ce4ea" }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["stream"] }
rust-embed = { version = "8.12.0", features = ["compression"] }
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
socket2 = { version = "0.6.5", features = ["all"] }
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2.4.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "process"] }
tower-http = { version = "0.6.11", features = ["cors"] }
ureq = { version = "3.4.0", default-features = false, features = ["json", "rustls"] }
url = "2.5.8"
# sACN source identity (CID) — a real RFC 4122 v4 UUID, generated once and persisted.
uuid = { version = "1.24.1", features = ["v4"] }
wgpu = { version = "29", default-features = false, features = ["wgsl", "vulkan"] }

# macOS has no native Vulkan; wgpu's plain `vulkan` feature is not implemented there
# and Instance::new panics. `vulkan-portability` routes Vulkan through MoltenVK —
# still Vulkan-only by design, no Metal fallback.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "29", default-features = false, features = ["wgsl", "vulkan-portability"] }

# Detecting whether a WebView2 runtime exists (see `webview2`). Both crates are
# ALREADY in the graph via tauri/wry — pinned to the versions the lockfile
# resolves so nothing gets compiled twice.
#
# `taskbar.rs` declares its one Win32 call by hand precisely to avoid this
# dependency, and that is the right call for `shell32`. It is the wrong call
# here: the version query lives in WebView2Loader, whose linkage webview2-com's
# build script exists to get right, and hand-linking it is the sort of thing
# that works until a toolchain update.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
windows = { version = "0.61.3", features = [
  "Win32_System_Com",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Validates generated patch WGSL in unit tests without needing a GPU. Version
# tracks wgpu (both 29) so tests judge by the same compiler the engine uses.
naga = { version = "29", features = ["wgsl-in"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["shader-hot-reload"]
# Read WGSL from disk and rebuild the pipeline on change (pattern dev).
shader-hot-reload = ["dep:notify"]
# Enabled by `tauri build` for release; serves embedded frontend assets.
custom-protocol = ["tauri/custom-protocol"]

# Thin LTO: near-fat-LTO quality at a fraction of the link time (this app's hot
# paths are GPU compute + network I/O, so fat LTO buys nothing measurable and
# serializes a massive relink that CI caches can't help with).
[profile.release]
lto = "thin"
codegen-units = 4
