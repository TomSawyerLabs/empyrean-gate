<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>patch-web demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0814; color: #e8e6f4; font: 14px system-ui, sans-serif; }
      body { display: grid; grid-template-rows: auto 1fr; }
      header { display: flex; gap: 8px; padding: 8px; align-items: center; flex-wrap: wrap; }
      canvas { width: 100%; height: 100%; display: block; }
      #status { color: #8a85a8; }
    </style>
  </head>
  <body>
    <header>
      <select id="preset"></select>
      <button id="tap">Burst</button>
      <button id="mic">Mic</button>
      <span id="status">loading…</span>
    </header>
    <canvas id="gate"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
